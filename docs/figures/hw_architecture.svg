<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="'Segoe UI','Inter',Arial,sans-serif">
  <rect width="1100" height="540" fill="#fff"/>
  <defs>
    <marker id="ak" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#333"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f9a825"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6a1b9a"/></marker>
    <marker id="apr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="#6a1b9a"/></marker>
    <marker id="ayb" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="#f9a825"/></marker>
  </defs>

  <!-- ════════════ LEFT PANEL: BLOCK DIAGRAM ════════════ -->
  <text x="265" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#222">(a) System Block Diagram</text>
  <rect x="8" y="30" width="514" height="498" rx="8" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- User Input -->
  <rect x="195" y="44" width="140" height="34" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
