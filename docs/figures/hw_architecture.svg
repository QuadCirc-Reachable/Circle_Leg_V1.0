  <rect x="765" y="232" width="90" height="48" rx="6" fill="#e3eefa" stroke="#1a3c6e" stroke-width="2"/>
  <text x="810" y="250" text-anchor="middle" font-size="9" font-weight="700" fill="#1a3c6e">STM32G4</text>
  <text x="810" y="263" text-anchor="middle" font-size="7" fill="#3a5f8a">Main PCB</text>
  <text x="810" y="274" text-anchor="middle" font-size="6.5" fill="#3a5f8a">500 Hz Control</text>

