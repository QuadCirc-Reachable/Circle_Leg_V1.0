  <path d="M765,258 L710,258" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- Left vertical rail -->
  <path d="M710,158 L710,402" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- FL M3508 tap (left) -->
  <path d="M710,158 L684,158" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- BL M3508 tap (left) -->
  <path d="M710,402 L684,402" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- Right: STM32 → rail -->
  <path d="M855,258 L910,258" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- Right vertical rail -->
  <path d="M910,158 L910,402" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- FR M3508 tap (from rail RIGHT to motor LEFT edge — symmetric) -->
  <path d="M910,158 L936,158" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <!-- BR M3508 tap -->
  <path d="M910,402 L936,402" fill="none" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- CAN 1 labels -->
  <text x="706" y="215" text-anchor="end" font-size="7" fill="#2e7d32" font-weight="600">CAN 1</text>
  <text x="914" y="215" font-size="7" fill="#2e7d32" font-weight="600">CAN 1</text>

  <!-- ═══ CAN 2 (red dashed) — Left rail x=725, Right rail x=895 ═══ -->
