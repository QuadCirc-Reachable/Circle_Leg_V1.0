  <rect x="984" y="416" width="28" height="56" rx="6" fill="#444" stroke="#222" stroke-width="1.5"/>
  <text x="998" y="448" text-anchor="middle" font-size="7" fill="#fff" font-weight="600">BR</text>

  <!-- ═══ LEFT JOINT MOTORS (HT8115) ═══ -->
  <circle cx="665" cy="120" r="17" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="665" y="118" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c62828">HT</text>
  <text x="665" y="128" text-anchor="middle" font-size="5.5" fill="#c62828">8115</text>

  <circle cx="665" cy="440" r="17" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="665" y="438" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c62828">HT</text>
  <text x="665" y="448" text-anchor="middle" font-size="5.5" fill="#c62828">8115</text>

  <!-- ═══ RIGHT JOINT MOTORS (HT8115) ═══ -->
  <circle cx="955" cy="120" r="17" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="955" y="118" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c62828">HT</text>
  <text x="955" y="128" text-anchor="middle" font-size="5.5" fill="#c62828">8115</text>

  <circle cx="955" cy="440" r="17" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="955" y="438" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c62828">HT</text>
  <text x="955" y="448" text-anchor="middle" font-size="5.5" fill="#c62828">8115</text>

  <!-- ═══ LEFT WHEEL MOTORS (M3508) ═══ -->
  <rect x="646" y="148" width="38" height="20" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="665" y="162" text-anchor="middle" font-size="6.5" font-weight="600" fill="#2e7d32">M3508</text>

  <rect x="646" y="392" width="38" height="20" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="665" y="406" text-anchor="middle" font-size="6.5" font-weight="600" fill="#2e7d32">M3508</text>

  <!-- ═══ RIGHT WHEEL MOTORS (M3508) ═══ -->
  <rect x="936" y="148" width="38" height="20" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="955" y="162" text-anchor="middle" font-size="6.5" font-weight="600" fill="#2e7d32">M3508</text>

  <rect x="936" y="392" width="38" height="20" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="955" y="406" text-anchor="middle" font-size="6.5" font-weight="600" fill="#2e7d32">M3508</text>

  <!-- ═══ CENTER COMPONENTS ═══ -->
