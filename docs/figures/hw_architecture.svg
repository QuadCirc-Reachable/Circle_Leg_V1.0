  <text x="810" y="98" text-anchor="middle" font-size="5.5" fill="#388e3c">D435</text>
  <line x1="810" y1="100" x2="810" y2="115" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Mini PC Host -->
  <rect x="755" y="115" width="110" height="46" rx="6" fill="#e8edf3" stroke="#333" stroke-width="1.5"/>
