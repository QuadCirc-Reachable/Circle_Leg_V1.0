  <text x="810" y="396" text-anchor="middle" font-size="7.5" fill="#f57f17">DJI TB-48</text>
  <text x="810" y="407" text-anchor="middle" font-size="6.5" fill="#f57f17">22.8V · 5700mAh</text>

  <!-- POWER: Battery → DCDC 19V (short connection) -->
  <path d="M762,380 L746,380 L746,348" fill="none" stroke="#f9a825" stroke-width="1.3" marker-end="url(#ay)"/>

  <!-- POWER: DCDC 19V → Host (routed right side, then up) -->
  <path d="M746,335 L868,335 L868,140 L865,140" fill="none" stroke="#f9a825" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ay)"/>
  <text x="872" y="240" font-size="6.5" fill="#e65100" font-weight="600" transform="rotate(90,872,240)">19V</text>

  <!-- POWER: Battery → STM32 (24V, routed left side) -->
  <path d="M762,385 L755,385 L755,268 L765,268" fill="none" stroke="#f9a825" stroke-width="1.3" marker-end="url(#ay)"/>
  <text x="748" y="326" text-anchor="end" font-size="6.5" fill="#e65100">24V</text>

  <!-- POWER: Battery → Motors (24V stub arrows outward) -->
  <path d="M762,395 L735,395 L700,395" fill="none" stroke="#f9a825" stroke-width="1.2" marker-end="url(#ay)"/>
  <text x="690" y="392" text-anchor="end" font-size="6" fill="#e65100">24V</text>
  <path d="M858,395 L885,395 L920,395" fill="none" stroke="#f9a825" stroke-width="1.2" marker-end="url(#ay)"/>
  <text x="930" y="392" font-size="6" fill="#e65100">24V</text>

