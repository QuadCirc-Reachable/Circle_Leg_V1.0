  <text x="810" y="146" text-anchor="middle" font-size="7" fill="#666">i7-1360P</text>
  <text x="810" y="157" text-anchor="middle" font-size="6.5" fill="#888">Vision + User Input</text>

  <!-- UART line (Host → STM32) -->
  <line x1="810" y1="161" x2="810" y2="232" stroke="#555" stroke-width="1.3"/>
  <text x="822" y="200" font-size="7" fill="#555">UART</text>

