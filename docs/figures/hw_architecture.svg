  <text x="265" y="70" text-anchor="middle" font-size="8.5" fill="#666">Xbox Controller</text>
  <line x1="265" y1="78" x2="265" y2="104" stroke="#333" stroke-width="1.3" marker-end="url(#ak)"/>

  <!-- DCDC 19V (left of HOST) -->
  <rect x="22" y="112" width="100" height="28" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="72" y="126" text-anchor="middle" font-size="8.5" font-weight="600" fill="#e65100">DCDC 19V Step-down</text>
  <text x="72" y="136" text-anchor="middle" font-size="7" fill="#f57f17">→ Mini PC Host</text>
  <!-- DCDC 19V → HOST (yellow arrow right) -->
  <line x1="122" y1="126" x2="192" y2="126" stroke="#f9a825" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="157" y="120" text-anchor="middle" font-size="7.5" fill="#e65100">19V</text>

  <!-- HOST -->
  <rect x="192" y="104" width="146" height="42" rx="8" fill="#e8edf3" stroke="#333" stroke-width="1.5"/>
  <text x="265" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#333">HOST</text>
  <text x="265" y="137" text-anchor="middle" font-size="9" fill="#555">Mini PC (i7-1360P)</text>

  <!-- Depth Camera (right of HOST, arrow from HOST → Camera) -->
  <rect x="380" y="108" width="126" height="34" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="443" y="122" text-anchor="middle" font-size="10" font-weight="600" fill="#2e7d32">Depth Camera</text>
