  <line x1="338" y1="125" x2="380" y2="125" stroke="#333" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="359" y="118" text-anchor="middle" font-size="7.5" fill="#2e7d32">USB 3.0</text>

  <!-- UART -->
  <line x1="265" y1="146" x2="265" y2="200" stroke="#333" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="248" y="168" text-anchor="end" font-size="8" fill="#555">UART via RS485</text>
  <text x="248" y="180" text-anchor="end" font-size="7.5" fill="#888">2 Mbps · CH343</text>

  <!-- STM32 -->
  <rect x="180" y="200" width="170" height="46" rx="8" fill="#e3eefa" stroke="#1a3c6e" stroke-width="2"/>
  <text x="265" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3c6e">Embedded Controller</text>
  <text x="265" y="236" text-anchor="middle" font-size="9.5" fill="#3a5f8a">STM32G473 · FreeRTOS · 500 Hz</text>

  <!-- IMU (right of STM32) -->
  <rect x="392" y="210" width="100" height="30" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="442" y="224" text-anchor="middle" font-size="10" font-weight="600" fill="#6a1b9a">IMU</text>
  <text x="442" y="235" text-anchor="middle" font-size="8" fill="#8e24aa">ICM-42688-P</text>
  <line x1="350" y1="225" x2="392" y2="225" stroke="#6a1b9a" stroke-width="1.3" marker-end="url(#ap)"/>
  <text x="371" y="218" text-anchor="middle" font-size="8" fill="#6a1b9a">SPI</text>

  <!-- CAN Ch1 branch (left) -->
  <path d="M220,246 L220,272 L140,302" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="155" y="270" text-anchor="middle" font-size="8" fill="#555">CAN Ch 1</text>
  <text x="155" y="282" text-anchor="middle" font-size="7.5" fill="#888">Current Loop</text>

  <!-- CAN Ch2 branch (right) -->
  <path d="M310,246 L310,272 L390,302" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="375" y="270" text-anchor="middle" font-size="8" fill="#555">CAN Ch 2</text>
  <text x="375" y="282" text-anchor="middle" font-size="7.5" fill="#888">MIT Control</text>

  <!-- C620 ESC -->
  <rect x="70" y="302" width="130" height="36" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="318" text-anchor="middle" font-size="10" font-weight="600" fill="#333">C620 Motor Drivers</text>
  <text x="135" y="331" text-anchor="middle" font-size="8" fill="#888">ESC × 4</text>
  <line x1="135" y1="338" x2="135" y2="368" stroke="#333" stroke-width="1.3" marker-end="url(#ak)"/>

  <!-- Integrated Drivers -->
  <rect x="325" y="302" width="140" height="36" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="395" y="318" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Integrated Drivers</text>
  <text x="395" y="331" text-anchor="middle" font-size="8" fill="#888">HT8115 × 4</text>
  <line x1="395" y1="338" x2="395" y2="368" stroke="#333" stroke-width="1.3" marker-end="url(#ak)"/>

  <!-- M3508 Wheel Motors -->
  <rect x="65" y="368" width="140" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="135" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#2e7d32">M3508 Wheel Motors</text>
  <text x="135" y="397" text-anchor="middle" font-size="8" fill="#388e3c">12:1 Gear · PID Velocity</text>

  <!-- Joint Motors HT8115 -->
  <rect x="320" y="368" width="150" height="36" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="395" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#c62828">Joint Motors</text>
  <text x="395" y="397" text-anchor="middle" font-size="8" fill="#d32f2f">HT8115 · MIT Impedance · >14 Nm</text>

  <!-- Battery 24V -->
  <rect x="165" y="438" width="200" height="36" rx="18" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="265" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="#e65100">Battery 24V</text>
  <text x="265" y="466" text-anchor="middle" font-size="7.5" fill="#f57f17">DJI TB-48 · 22.8V · 5700mAh</text>

  <!-- POWER: Battery → DCDC 19V (left edge route, dashed) -->
  <path d="M165,456 L14,456 L14,126 L22,126" fill="none" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#ay)"/>

  <!-- POWER: Battery → 24V up center vertical to STM32 (between motor columns) -->
  <line x1="265" y1="438" x2="265" y2="248" stroke="#f9a825" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="275" y="335" font-size="7.5" fill="#e65100" font-weight="600">24V</text>

  <!-- POWER: Battery → M3508 (24V branch left) -->
  <path d="M265,404 L205,390" fill="none" stroke="#f9a825" stroke-width="1.3" marker-end="url(#ay)"/>
  <text x="230" y="400" text-anchor="middle" font-size="7" fill="#e65100">24V</text>

  <!-- POWER: Battery → HT8115 (24V branch right) -->
  <path d="M265,404 L320,390" fill="none" stroke="#f9a825" stroke-width="1.3" marker-end="url(#ay)"/>
  <text x="298" y="400" text-anchor="middle" font-size="7" fill="#e65100">24V</text>

  <!-- Legend left -->
  <g transform="translate(28,516)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#333" stroke-width="1.5"/>
    <text x="27" y="4" font-size="8" fill="#555">Signal Flow</text>
    <line x1="100" y1="0" x2="122" y2="0" stroke="#f9a825" stroke-width="1.8"/>
    <text x="127" y="4" font-size="8" fill="#555">Power (24V)</text>
    <line x1="195" y1="0" x2="217" y2="0" stroke="#f9a825" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="222" y="4" font-size="8" fill="#555">Regulated (19V)</text>
  </g>

